name: sonar

# SonarCloud IaC quality gate for the Terraform (/workflow/sonarcloud). Standalone — kept out of
# terraform-plan.yml so it can run on push to develop/main (new-code baseline) WITHOUT triggering
# the AWS OIDC plan. checkov (policy/security) stays in terraform-plan.yml; the two are complementary.
# Runs on EVERY PR to develop/main so the required `sonar` check always reports a status — a path filter
# (the "Detect IaC changes" step) skips the scan for docs-only PRs, which still finish the job green.
# Without this, a required check + a trigger-level `paths:` filter leaves docs-only PRs BLOCKED forever
# (the check never runs). On push to develop/main (terraform paths only) it sets SonarCloud's baseline.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths:
      - "terraform/**"
      - "sonar-project.properties"
      - ".github/workflows/sonar.yml"

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 20 is deprecated on runners (forced off 2026-06-16). Run bundled JS actions on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history — SonarCloud uses git blame for accurate new-code / authorship attribution.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Does this change touch Terraform/config, or is it docs-only? Docs-only PRs skip the scan below
      # but the job still completes green, satisfying the required `sonar` check. (Free on public repos.)
      - name: Detect IaC changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            iac:
              - 'terraform/**'
              - 'sonar-project.properties'
              - '.github/workflows/sonar.yml'

      # `qualitygate.wait=true` polls SonarCloud and FAILS the job on a red gate.
      # Requires CI-based analysis (SonarCloud Automatic Analysis must be OFF for this project).
      - name: SonarCloud scan (quality gate blocks)
        if: steps.changes.outputs.iac == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true
